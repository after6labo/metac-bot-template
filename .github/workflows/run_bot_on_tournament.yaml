name: Forecast on new AI tournament questions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - main.py
      - bot_runtime.py
      - runtime_policy.py
      - request_budget.py
      - operations/github_scheduler.gs
      - tests/**
      - .github/workflows/run_bot_on_tournament.yaml
  schedule:
    - cron: "7,27,47 * * * *" # 90-minute forecast windows; no LLM call when empty

permissions:
  contents: write

# Add concurrency group to prevent parallel runs
concurrency:
  group: metaculus-zero-cost
  cancel-in-progress: false


# Daily job to run the simple forecast bot
jobs:
  forecast_job:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove result from previous checkout
        run: rm -f run-results/latest.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      # Adding the below will make the workflow faster, but will mean you don't automatically get updates from forecasting-tools and other packages
      # - name: Load cached venv
      #   id: cached-poetry-dependencies
      #   uses: actions/cache@v4
      #   with:
      #     path: .venv
      #     key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Run offline regression tests
        run: poetry run python -m unittest discover -s tests -v
      - name: Test external scheduler without network or secrets
        run: node --test tests/test_external_scheduler.cjs
      - name: Run bot
        run: |
          poetry run python main.py
        # this reads the environment variables from the github repository.
        # Store under Settings --> Secrets and variables --> Actions
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }} # replace this with the name of the variable under which you stored your own Metaculus token
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Preserve run result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            run-results/latest.json
            run-results/budget.json
          if-no-files-found: warn
          retention-days: 30
      - name: Record measured result and request quota
        if: always()
        run: |
          if [ -f run-results/latest.json ]; then
            mkdir -p run-results/history
            cp run-results/latest.json "run-results/history/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
            git add run-results/latest.json run-results/history
          fi
          if [ -f run-results/budget.json ]; then
            git add run-results/budget.json
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record autonomous forecast run ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main
